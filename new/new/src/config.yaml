  - kw_min_min
  - kw_max_min
  - kw_avg_min
  - kw_min_max
  - kw_max_max
  - kw_avg_max
  - kw_min_avg
  - kw_max_avg
  - kw_avg_avg

nominal_features:
  - data_channel
  - weekday
  
ordinal_features:
  - URL


